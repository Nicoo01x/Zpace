# Builds signed installers on a tag (v1.2.3) — Windows (NSIS), macOS (universal .dmg), Linux
# (.deb, .rpm, .AppImage) — and publishes them on this repo's GitHub release for the tag, with
# the updater manifest (latest.json) the app checks at launch. Create the release with its notes
# before pushing the tag (gh release create vX.Y.Z --notes-file …) and the assets land in it.
# Repository secrets: TAURI_SIGNING_PRIVATE_KEY (the contents of ~/.tauri/zorynq.key) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD (empty if the key has none).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Writes the release and its assets; nothing else.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: '--bundles nsis'
          - os: macos-latest
            args: '--target universal-apple-darwin'
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux packages the webview needs
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libxdo-dev libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Zpace ${{ github.ref_name }}'
          releaseBody: 'See the commits since the previous tag.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
