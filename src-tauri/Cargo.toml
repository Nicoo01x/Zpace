[package]
name = "zpace"
version = "0.1.11"
license = "MIT"
description = "A desktop workspace for Claude Code and other CLI agents."
authors = ["Zpace"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "zpace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "devtools", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
which = "8"
trash = "5"
base64 = "0.23"
url = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
ureq = { version = "3", features = ["json"] }
notify = "8"
regex = "1"
# the voice assistant's MCP server (loopback HTTP, no async runtime)
tiny_http = "0.12"
# the voice assistant's microphone (the system default input, any format)
cpal = "0.18"

# screenshots + the clipboard image: every platform
png = "0.18"
arboard = { version = "3", default-features = false, features = ["image-data"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Media_SpeechRecognition", "Media_Control", "Media_Devices", "Devices_Enumeration", "Storage_Streams", "Globalization", "Foundation", "Foundation_Collections", "Win32_System_WinRT",
  # the desktop island: Action Center, app logos, the foreground window and its icon, Core Audio, the battery, the clipboard
  "UI_Notifications", "UI_Notifications_Management", "ApplicationModel",
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Shell", "Win32_Graphics_Gdi",
  "Win32_System_Threading", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_DataExchange", "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints",
] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
